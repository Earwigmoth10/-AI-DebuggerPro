<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Website - AI Debugger Pro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="learn.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <div class="logo">
            <i class="fas fa-robot"></i> AI Debugger<span class="highlight">Pro</span>
        </div>
        <div class="nav-links">
            <a href="index.html#modules">Modules <i class="fas fa-caret-down"></i></a>
            <a href="index.html#docs">Docs</a>
            <a href="index.html#about">About</a>
        </div>
        <div class="nav-actions">
            <a href="index.html" class="btn-signin">Home</a>
            <a href="debugger.html" class="btn-cta">Try Debugger</a>
        </div>
    </div>
</nav>

<section class="learn-page">
    <div class="container">
        <h1 class="learn-title">Learn <span class="gradient-text">Web Dev</span></h1>
        <p class="learn-sub">Step-by-step tutorials on HTML, CSS, PHP, MySQL &amp; debugging concepts.</p>

        <div class="progress-bar-wrap">
            <div class="progress-bar-track">
                <div id="progressBarFill" class="progress-bar-fill"></div>
            </div>
            <div class="progress-bar-meta">
                <span id="progressText">0 / 0 lessons complete</span>
                <button id="resetProgressBtn" class="reset-link" type="button">Reset progress</button>
            </div>
        </div>

        <div class="learn-layout">
            <aside class="learn-sidebar">
                <nav id="topicNav" aria-label="Lesson topics"></nav>
            </aside>

            <main class="learn-content">
                <div id="lessonHeader" class="lesson-header"></div>
                <div id="lessonBody" class="lesson-body"></div>

                <div class="quiz-box" id="quizBox">
                    <h4><i class="fas fa-circle-question"></i> Quick Check</h4>
                    <p id="quizQuestion" class="quiz-question"></p>
                    <form id="quizForm" class="quiz-options"></form>
                    <button id="quizSubmit" class="btn-primary-large quiz-submit" type="button">Check Answer</button>
                    <div id="quizFeedback" class="quiz-feedback" hidden></div>
                </div>

                <div class="lesson-footer-nav">
                    <button id="prevLessonBtn" class="btn-secondary-large" type="button">
                        <i class="fas fa-arrow-left"></i> Previous
                    </button>
                    <span id="lessonPosition" class="lesson-position"></span>
                    <button id="nextLessonBtn" class="btn-secondary-large" type="button">
                        Next <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </main>
        </div>
    </div>
</section>

<script src="learn.js"></script>
</body>
</html>
